name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two Terraform operations against the same state at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  TF_VERSION: 1.17.1
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  # Terraform azurerm provider + backend authenticate as a service principal
  # with a client secret (ARM_CLIENT_SECRET is set only on the jobs that need it).
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Optional overrides for infra/variables.tf.
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'uksouth' }}

jobs:
  # CI: runs on every push/PR, no Azure access needed.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (into ./dist)
        run: npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  # PRs: show what the infrastructure change would be.
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}"
          -backend-config="key=cicd-svc.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        run: terraform plan -lock-timeout=5m

  # CD: on main, apply the infrastructure then publish the code to it.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Plain stdout so `terraform output -raw` can be captured.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}"
          -backend-config="key=cicd-svc.tfstate"
          -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -lock-timeout=5m tfplan

      - name: Read Terraform outputs
        id: tf
        working-directory: infra
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "products_url=$(terraform output -raw products_url)" >> "$GITHUB_OUTPUT"

      - name: Azure login (for Functions Core Tools)
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ vars.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ vars.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ vars.AZURE_TENANT_ID }}"}'

      - name: Install dependencies
        run: npm ci

      - name: Build (into ./dist)
        run: npm run build

      # Core Tools come from devDependencies. --javascript because there is no
      # local.settings.json in CI and the TypeScript is already compiled.
      - name: Publish to Function App
        run: npx --no-install func azure functionapp publish "${{ steps.tf.outputs.function_app_name }}" --javascript

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ steps.tf.outputs.products_url }}"; then exit 0; fi
            echo "Not ready yet, retrying in 15s..."; sleep 15
          done
          echo "Smoke test failed"; exit 1
